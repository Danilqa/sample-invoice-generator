<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32">
  <title>Test Invoice Generator</title>
  <defs>
    <!-- Receipt with a torn bottom edge and two lines, cut out of the coin -->
    <mask id="receipt" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M10 8H22V24L20 22L18 24L16 22L14 24L12 22L10 24Z" fill="#000"/>
      <path d="M13 12h6v2h-6zM13 16h4v2h-4z" fill="#fff"/>
    </mask>
  </defs>
  <!-- App-icon tile: the white mark on a black rounded square reads on light and dark backgrounds alike.
       logo.png, favicon.png and the repo's root logo.png are 256px exports of this file. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g transform="translate(4 4) scale(0.75)">
    <circle cx="16" cy="16" r="15" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="16" cy="16" r="12" fill="#fff" mask="url(#receipt)"/>
  </g>
</svg>
